---
name: Ansible CI

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
  pull_request:
    paths:
      - "ansible/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint proxmoxer paramiko requests

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          ansible-lint ansible/playbooks ansible/roles

      - name: Syntax check playbooks
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          # minimal inventory
          cat > inventory.yml <<EOF
          all:
            hosts:
              localhost:
                ansible_connection: local
          EOF

          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook" -i inventory.yml
          done
