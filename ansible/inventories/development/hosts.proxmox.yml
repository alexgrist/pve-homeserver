plugin: community.proxmox.proxmox

want_facts: true
exclude_nodes: true

# Automatically build host groups based on Proxmox tags
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: ""
    separator: ""

# Filter hosts belonging to dev and containers that are not running
filters:
  - proxmox_vmtype == "lxc"
  - "'dev' in proxmox_tags_parsed"
  - proxmox_status == "running"

compose:
  ansible_connection: "'community.proxmox.proxmox_pct_remote'"
  ansible_proxmox_node: proxmox_node
  ansible_proxmox_vmid: proxmox_vmid
