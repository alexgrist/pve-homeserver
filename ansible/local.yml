- hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    host_role_name: "{{ ansible_facts.hostname }}"
    host_role_dir: "{{ playbook_dir }}/roles/{{ host_role_name }}"
    host_role_strict: true

  pre_tasks:
    - name: Check for host-specific role
      ansible.builtin.stat:
        path: "{{ host_role_dir }}/tasks/main.yml"
      register: host_role_stat
      tags: [always, host_role]

    - name: Fail if strict and role missing
      ansible.builtin.fail:
        msg: "No role for {{ host_role_name }} in {{ playbook_dir }}/roles/"
      when:
        - host_role_strict | bool
        - not host_role_stat.stat.exists
      tags: [always, host_role]

    - name: Audit selection
      ansible.builtin.debug:
        msg: "host={{ host_role_name }} role_found={{ host_role_stat.stat.exists }}"
      tags: [always, audit]

  roles:
    - role: common
      tags: [common]

  tasks:
    - name: Apply host-specific role
      ansible.builtin.include_role:
        name: "{{ host_role_name }}"
        apply:
          tags: [host_role]
      when: host_role_stat.stat.exists
      tags: [host_role]
