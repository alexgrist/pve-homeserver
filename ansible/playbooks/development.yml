---
- name: Apply development roles for testing
  hosts: dev
  gather_facts: true
  become: false

  pre_tasks:
    - name: Ensure execution through pct into an LXC
      ansible.builtin.assert:
        that:
          - ansible_connection == 'community.proxmox.proxmox_pct_remote'
        fail_msg: "Not connected via pct. Refusing {{ inventory_hostname }}."

  roles:
    - role: common

  tasks:
    - name: Verify execution context
      ansible.builtin.debug:
        msg: "Role execution context: {{ ansible_facts.hostname }}"

    - name: Dynamically include roles matching tags
      ansible.builtin.include_role:
        name: "{{ proxmox_tag }}"
      loop: "{{ proxmox_tags_parsed | reject('eq', 'dev') | list }}"
      loop_control:
        loop_var: proxmox_tag
        label: "{{ proxmox_tag }}"
      when: >-
        query('ansible.builtin.first_found',
          [proxmox_tag ~ '/tasks/main.yml'],
          paths=role_search_paths,
          skip=True) | length > 0
