---
- name: Apply development roles for testing
  hosts: localhost
  gather_facts: true
  become: false

  vars:
    # Proxmox tags to test dynamic role loading locally
    proxmox_tags:
      - common

  tasks:
    - name: Dynamically include roles matching tags
      ansible.builtin.include_role:
        name: "{{ proxmox_tag }}"
      loop: "{{ proxmox_tags }}"
      loop_control:
        loop_var: proxmox_tag
        label: "{{ proxmox_tag }}"
      when: >-
        query('ansible.builtin.first_found',
          [proxmox_tag ~ '/tasks/main.yml'],
          paths=role_search_paths,
          skip=True) | length > 0
