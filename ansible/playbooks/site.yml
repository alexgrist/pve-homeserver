---
- name: Apply roles for all LXC containers
  hosts: proxmox_all_lxc
  gather_facts: true
  become: false

  pre_tasks:
    - name: Ensure execution through pct into an LXC
      ansible.builtin.assert:
        that:
          - ansible_connection == 'community.proxmox.proxmox_pct_remote'
        fail_msg: "Not connected via pct. Refusing {{ inventory_hostname }}."

  roles:
    - role: common

  tasks:
    - name: Check if roles exist for the given Proxmox tags
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../roles/{{ proxmox_tag }}"
      loop: "{{ proxmox_tags_parsed }}"
      loop_control:
        loop_var: proxmox_tag
      register: role_stats

    - name: Dynamically include roles matching tags
      ansible.builtin.include_role:
        name: "{{ role_stat.proxmox_tag }}"
      loop: "{{ role_stats.results }}"
      loop_control:
        loop_var: role_stat
        label: "{{ role_stat.proxmox_tag }}"
