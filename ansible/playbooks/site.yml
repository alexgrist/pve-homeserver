---
- name: Apply roles for all LXC containers
  hosts: proxmox_all_lxc
  gather_facts: true
  become: false

  pre_tasks:
    - name: Ensure execution through pct into an LXC
      ansible.builtin.assert:
        that:
          - ansible_connection == 'community.proxmox.proxmox_pct_remote'
        fail_msg: "Not connected via pct. Refusing {{ inventory_hostname }}."

  roles:
    - role: common

  tasks:
    - name: Dynamically include roles matching tags
      ansible.builtin.import_tasks: tasks/tagged-roles.yml
      vars:
        proxmox_tags: "{{ proxmox_tags_parsed }}"
