---
# shared by the playbooks, the tags come from the proxmox inventory or a manual test list
- name: Dynamically include roles matching tags
  ansible.builtin.include_role:
    name: "{{ proxmox_tag }}"
  loop: "{{ proxmox_tags }}"
  loop_control:
    loop_var: proxmox_tag
    label: "{{ proxmox_tag }}"
  when: >-
    query('ansible.builtin.first_found',
      [proxmox_tag ~ '/tasks/main.yml'],
      paths=role_search_paths,
      skip=True) | length > 0
