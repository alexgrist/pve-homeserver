---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - python3-debian
      - gnupg2
    state: present

- name: Configure root autologin for PVE console
  when:
    - ansible_facts['virtualization_type'] == 'lxc'
    - ansible_facts['virtualization_role'] == 'guest'
  block:
    - name: Create getty override directory
      ansible.builtin.file:
        path: /etc/systemd/system/container-getty@1.service.d
        state: directory
        mode: "0755"

    - name: Configure getty to automatically login root
      ansible.builtin.copy:
        dest: /etc/systemd/system/container-getty@1.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud tty%I 115200,38400,9600 $TERM

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart container getty
      ansible.builtin.systemd:
        name: container-getty@1.service
        state: restarted

- name: Install managed-host MOTD script
  ansible.builtin.copy:
    dest: /etc/profile.d/homelab-motd.sh
    mode: "0755"
    content: |
      #!/bin/sh
      host_name="$(hostname --short 2>/dev/null || hostname)"
      os_name="$(. /etc/os-release 2>/dev/null && printf '%s' "${PRETTY_NAME:-Linux}" || printf '%s' Linux)"
      kernel="$(uname -r 2>/dev/null || printf '%s' unknown)"
      addresses="$(hostname -I 2>/dev/null | xargs)"
      uptime="$(uptime -p 2>/dev/null || uptime 2>/dev/null || printf '%s' unknown)"

      printf '\n'
      printf '  %s\n' "${host_name}"
      printf '  --------------------------------\n'
      printf '  OS:       %s\n' "${os_name}"
      printf '  Kernel:   %s\n' "${kernel}"
      printf '  Address:  %s\n' "${addresses:-none}"
      printf '  Uptime:   %s\n' "${uptime}"
      printf '\n'
