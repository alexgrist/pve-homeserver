---
- name: Require vaulted CouchDB credentials
  ansible.builtin.assert:
    that:
      - couchdb_admin_password | length > 0
      - couchdb_admin_password != 'change-me-with-ansible-vault'
      - couchdb_cookie | length > 0
    fail_msg: Set couchdb_admin_password and couchdb_cookie in an Ansible Vault variable before deploying CouchDB.

- name: Ensure debconf-utils is installed
  ansible.builtin.apt:
    name:
      - debconf
      - debconf-utils
    state: present
    update_cache: true

- name: Add CouchDB repository
  ansible.builtin.deb822_repository:
    name: couchdb
    types: [deb]
    uris: https://apache.jfrog.io/artifactory/couchdb-deb/
    suites: "{{ ansible_facts.distribution_release }}"
    components: [main]
    signed_by: https://couchdb.apache.org/repo/keys.asc
    state: present
  register: couchdb_repo

- name: Preseed CouchDB setup
  ansible.builtin.debconf:
    name: couchdb
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: "couchdb/mode", value: "standalone", vtype: "select" }
    - { question: "couchdb/bindaddress", value: "{{ couchdb_bind_address }}", vtype: "string" }
    - { question: "couchdb/adminpass", value: "{{ couchdb_admin_password }}", vtype: "password" }
    - { question: "couchdb/adminpass_again", value: "{{ couchdb_admin_password }}", vtype: "password" }
    - { question: "couchdb/cookie", value: "{{ couchdb_cookie }}", vtype: "string" }
  no_log: true

- name: Install CouchDB
  ansible.builtin.apt:
    name:
      - "{{ couchdb_package }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure CouchDB data directory exists
  ansible.builtin.file:
    path: "{{ couchdb_data_directory }}"
    state: directory
    owner: couchdb
    group: couchdb
    mode: "0750"

- name: Configure CouchDB data path
  community.general.ini_file:
    path: /opt/couchdb/etc/local.ini
    section: couchdb
    option: database_dir
    value: "{{ couchdb_data_directory }}"
    owner: couchdb
    group: couchdb
    mode: "0640"
  notify: Restart CouchDB

- name: Ensure CouchDB is enabled and running
  ansible.builtin.service:
    name: couchdb
    enabled: true
    state: started
